<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />

    <script src="./js/main.js"></script>

    <link rel="icon" href="./resources/icon.png" type="image/png" />
    <title>Puzzles</title>
  </head>
  <body>
    <navbar
      ><img src="/public/resources/icon.png" width="40" height="40" />
      <a href="">Criar</a>
    </navbar>

    <div class="main-container">
      <div id="puzzle-container" data-rows="3" data-columns="3"></div>
    </div>

    <div class="options">
      <div style="cursor: pointer" onclick="window.resetPuzzle()">Resetar puzzle</div>
      <label for="row-input-count">
        Quantidade de Linhas: <span id="row-val">3</span>
        <input id="row-input-count" onchange="window.changeRowCount(this.value)" type="range" min="3" max="10" />
      </label>
      <label for="col-input-count">
        Quantidade de Colunas: <span id="col-val">3</span>
        <input id="col-input-count" onchange="window.changeColCount(this.value)" type="range" min="3" max="10" />
      </label>
    </div>
  </body>
</html>
